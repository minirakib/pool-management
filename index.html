<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050a08">
  <meta name="description" content="CUECORE — a local-first snooker club management demo.">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <title>CUECORE · Club operations</title>
  <script>
    // Apply the saved light/dark theme before anything paints, so a reload never flashes the wrong colours.
    try {
      var saved = JSON.parse(localStorage.getItem("cuecore.demo.v1") || "null");
      if (saved && saved.settings && saved.settings.theme === "light") document.documentElement.dataset.theme = "light";
    } catch (e) { /* storage blocked or unreadable: keep dark */ }
  </script>
  <style>
    /* Boot screen: visible until React renders, so the page is never blank while scripts load. */
    html, body { margin: 0; background: #050a08; }
    html[data-theme="light"], html[data-theme="light"] body { background: #edf3ef; }
    .boot { position: fixed; inset: 0; display: grid; place-content: center; justify-items: center; gap: 18px; font: 600 12px/1.4 "Segoe UI", Arial, sans-serif; letter-spacing: .3em; text-transform: uppercase; color: #73907f; }
    .boot-ball { width: 46px; height: 46px; border-radius: 50%; background: radial-gradient(circle at 34% 30%, #fff 0 9%, #8af0c2 26%, #1fdc8a 55%, #0d6b43 100%); box-shadow: 0 0 0 4px rgba(31,220,138,.15), 0 0 30px rgba(31,220,138,.45); animation: boot-pulse 1.2s ease-in-out infinite; }
    .boot b { color: #eafff4; font-size: 18px; letter-spacing: .18em; }
    html[data-theme="light"] .boot b { color: #0b1a12; }
    .boot noscript { max-width: 300px; color: #ff5c6c; letter-spacing: 0; text-transform: none; text-align: center; font-size: 13px; }
    @keyframes boot-pulse { 50% { transform: scale(.88); opacity: .7; } }
  </style>
</head>
<body>
  <div id="root">
    <div class="boot" role="status" aria-label="Loading CUECORE">
      <div class="boot-ball"></div>
      <b>CUECORE</b>
      <span>Loading club…</span>
      <noscript>CUECORE needs JavaScript. Please enable it in your browser settings and reload.</noscript>
    </div>
  </div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
