# Netlify: build the Vite app and serve it as a single-page app.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Vite 8 needs Node 20.19+; pin a current LTS so builds match local development.
  NODE_VERSION = "22"

# ---------- Redirects (first match wins; existing files are always served first) ----------

# A missing file under /assets/ (e.g. a page chunk from an older deploy) must be a real 404,
# not index.html, so the app can detect it and reload itself onto the new version.
[[redirects]]
  from = "/assets/*"
  to = "/404.html"
  status = 404

# Every app page (/, /salary, /reports, ...) is the same index.html; the app reads the path.
# 200 = rewrite (the URL stays the same), so reloading /salary keeps you on Salary.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ---------- Headers ----------

# Hashed build files never change, so browsers can keep them for a year.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Files that point at the current build must always be checked, so a new deploy is picked up
# on the next load. (Netlify already revalidates HTML by default; this makes it explicit.)
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/registerSW.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-cache"
    Content-Type = "application/manifest+json"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
